<!doctype html>
<html lang="en" class="intro-on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f2" />
    <style>
      html.intro-on,
      html.intro-on body {
        overflow: hidden;
      }
      .intro {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: grid;
        place-items: center;
        background: #fff;
      }
      .intro.is-leaving {
        animation: intro-leave 0.9s cubic-bezier(0.76, 0, 0.24, 1) forwards;
      }
      .intro-lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: intro-rise 1.05s cubic-bezier(0.16, 1, 0.36, 1) both;
      }
      .intro img {
        width: min(220px, 42vw);
        height: auto;
      }
      .intro p {
        margin: 22px 0 0;
        color: #000;
        font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        font-size: clamp(18px, 3.4vw, 28px);
        font-weight: 500;
        letter-spacing: 0.22em;
        line-height: 1;
      }
      @keyframes intro-rise {
        from {
          transform: translateY(100vh);
        }
        to {
          transform: translateY(0);
        }
      }
      @keyframes intro-leave {
        to {
          transform: translateY(-100%);
        }
      }
    </style>
    <meta
      name="description"
      content="RIVERMINDSTYLE. Considered silhouettes, expressive femininity. Discover a wardrobe for becoming."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>RIVERMINDSTYLE — A wardrobe for becoming</title>
  </head>
  <body>
    <div class="intro" id="intro">
      <div class="intro-lockup">
        <img src="/intro-mark.png" alt="" width="970" height="840" />
        <p>RIVERMINDSTYLE</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
